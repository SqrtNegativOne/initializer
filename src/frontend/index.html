<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Genesis</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="app">
        <audio id="ping-sound" src="assets/ping.wav" preload="auto"></audio>
        <!-- Start Screen -->
        <div id="screen-start" class="screen active">
            <!-- Buttons will be loaded dynamically -->
        </div>

        <!-- Quick Job Screen -->
        <div id="screen-quick-job" class="screen">
            <div class="qj-title">How long will this take?</div>
            <div class="qj-input-wrapper">
                <input type="number" class="qj-input" id="qj-minutes" autofocus onkeypress="handleQjKeypress(event)">
                <span>minutes</span>
            </div>
        </div>

        <!-- Checklist Screen -->
        <div id="screen-checklist" class="screen">
            <div id="task-container" onclick="handleTaskClick()">
                <div class="task-text" id="task-text">Loading...</div>
                <div class="task-info" id="task-info"></div>
            </div>
        </div>
    </div>

    <script>
        let currentTask = null;
        let isTaskClickable = false;
        let waitTimer = null;

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(el => {
                if(el.classList.contains('active')) {
                    el.classList.remove('active');
                    el.classList.add('slide-out');
                    setTimeout(() => el.classList.remove('slide-out'), 500);
                }
            });
            setTimeout(() => {
                const target = document.getElementById(screenId);
                target.classList.add('active');
            }, 50);
        }

        let buttonsLoading = false;

        async function loadButtons() {
            if (window._buttonsLoaded || buttonsLoading) return;
            if (!window.pywebview || !window.pywebview.api) return;

            buttonsLoading = true;
            try {
                const routines = await pywebview.api.get_routines();
                if (!Array.isArray(routines) || routines.length === 0) return;

                const startScreen = document.getElementById('screen-start');
                startScreen.innerHTML = ''; // clear existing

                routines.forEach(routine => {
                    const btn = document.createElement('button');
                    btn.className = 'btn';
                    btn.innerText = routine.name;
                    btn.onclick = () => startRoutine(routine.name);
                    startScreen.appendChild(btn);
                });

                window._buttonsLoaded = true;
            } catch (e) {
                console.log('Failed to load routines, retrying...', e);
            } finally {
                buttonsLoading = false;
            }
        }

        window.addEventListener('pywebviewready', loadButtons);
        loadButtons();
        const buttonsTimer = setInterval(() => {
            if (window._buttonsLoaded) {
                clearInterval(buttonsTimer);
                return;
            }
            loadButtons();
        }, 100);

        async function startRoutine(name) {
            const response = await pywebview.api.start_routine(name);
            if (response && response.status === 'ok') {
                if (response.type === 'checklist') {
                    document.body.classList.add('checklist-mode');
                    showScreen('screen-checklist');
                    loadNextTask();
                    pywebview.api.enter_checklist_mode();
                } else if (response.type === 'quick_job') {
                    await pywebview.api.unfullscreen_and_maximize();
                    showScreen('screen-quick-job');
                    setTimeout(() => document.getElementById('qj-minutes').focus(), 100);
                }
                // 'quit' handles quit internally
            }
        }

        async function loadNextTask() {
            const task = await pywebview.api.get_current_task();
            if (!task) {
                // Done
                await pywebview.api.quit_app();
                return;
            }
            currentTask = task;
            
            const taskTextEl = document.getElementById('task-text');
            const taskInfoEl = document.getElementById('task-info');
            const container = document.getElementById('task-container');

            // Reset animation
            container.style.transform = 'translateX(20px)';
            container.style.opacity = '0';
            taskTextEl.classList.remove('completed');
            
            setTimeout(() => {
                taskTextEl.innerText = task.text;
                container.style.transform = 'translateX(0)';
                container.style.opacity = '1';

                if (task.type === 'W') {
                    isTaskClickable = false;
                    let timeLeft = task.duration;
                    taskInfoEl.innerText = `Wait ${timeLeft}s...`;
                    
                    waitTimer = setInterval(() => {
                        timeLeft--;
                        if (timeLeft <= 0) {
                            clearInterval(waitTimer);
                            taskInfoEl.innerText = 'Ready';
                            isTaskClickable = true;
                            document.getElementById('ping-sound').play().catch(e => console.log(e));
                        } else {
                            taskInfoEl.innerText = `Wait ${timeLeft}s...`;
                        }
                    }, 1000);
                } else if (task.type === 'L') {
                    isTaskClickable = true;
                    taskInfoEl.innerText = 'Click to launch';
                } else {
                    isTaskClickable = true;
                    taskInfoEl.innerText = 'Click to complete';
                }
            }, 300);
        }

        async function handleTaskClick() {
            if (!currentTask || !isTaskClickable) return;
            isTaskClickable = false; // Prevent double clicks

            const taskTextEl = document.getElementById('task-text');
            const taskInfoEl = document.getElementById('task-info');
            const container = document.getElementById('task-container');
            
            taskTextEl.classList.add('completed');
            
            if (currentTask.type === 'L') {
                taskInfoEl.innerText = 'Launching... wait 5s';
                // Complete task launches it in backend
                await pywebview.api.complete_task(currentTask.index);
                
                // Wait 5 seconds before sliding
                setTimeout(async () => {
                    document.getElementById('ping-sound').play().catch(e => console.log(e));
                    container.style.transform = 'translateX(-20px)';
                    container.style.opacity = '0';
                    setTimeout(loadNextTask, 300);
                }, 5000);
            } else {
                taskInfoEl.innerText = '';
                const result = await pywebview.api.complete_task(currentTask.index);
                container.style.transform = 'translateX(-20px)';
                container.style.opacity = '0';
                
                if (result.status === 'done') {
                    setTimeout(() => pywebview.api.quit_app(), 300);
                } else {
                    setTimeout(loadNextTask, 300);
                }
            }
        }

        async function handleQjKeypress(event) {
            if (event.key === 'Enter') {
                const val = document.getElementById('qj-minutes').value;
                if (val) {
                    await pywebview.api.launch_everything_normally();
                }
            }
        }
        
        // Wait for pywebview to be ready if needed, though buttons handle async calls
    </script>
</body>
</html>
